name: release

# One release for the whole library, cut from a vX.Y.Z tag.
#
# This used to release each package separately (tag <pkg>-vX.Y.Z, one GitHub Release per
# package, a change detector to decide which). In seven releases only `drlg` ever went out,
# fourteen of fifteen manifests sat at 0.1.0 having never shipped, and the bindings downstream
# were already called libd2 rather than libd2-drlg. The granularity was real in the source tree
# and imaginary at the boundary, so the boundary is now one artifact per target, named for the
# library and versioned with it.
#
# Push a tag to release; run it by hand with dry_run to build and package without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + package only — no GitHub Release, no npm publish'
        type: boolean
        default: true
      capi:
        description: 'Subsystems in the native/wasm bundle (comma list: drlg,pf,item)'
        default: 'drlg,pf,item'
        type: string

permissions:
  contents: write   # create the release
  id-token: write   # OIDC trusted publishing to npm (provenance, no NPM_TOKEN secret)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # a half-published release is worse than a queued one

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      capi: ${{ steps.v.outputs.capi }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          # The tag is the source of truth when there is one; otherwise the manifest, so a
          # dry run off a branch still produces correctly-named archives.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"; version="${tag#v}"
          else
            version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)"
            tag="v$version"
          fi
          # A manifest that disagrees with its own tag is how a release ends up describing
          # something other than what it contains.
          manifest="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$manifest" != "$version" ]; then
            echo "::error::tag $tag does not match build.zig.zon version $manifest"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "capi=${{ inputs.capi || 'drlg,pf,item' }}" >> "$GITHUB_OUTPUT"
          echo "releasing $tag (version $version)"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86-windows-gnu
          # musl, for Alpine and the containers .NET is usually deployed in. A glibc build
          # will not load there.
          - x86_64-linux-musl
          - aarch64-linux-musl
          # 32-bit ARM, RISC-V and FreeBSD. The .NET SDK cannot build a RID-specific app for
          # the last two (no official apphost), but a PORTABLE app resolves the native asset by
          # the host's own RID at run time, so shipping them is what makes those platforms work
          # at all. One matrix entry each, because zig cross-compiles them from the same host.
          - arm-linux-gnueabihf
          - arm-linux-musleabihf
          - riscv64-linux-gnu
          - x86_64-freebsd
          - aarch64-freebsd
          - wasm32-freestanding
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Build the bundle for ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Size is what matters for the module a browser downloads; speed for everything else.
          # Passing this explicitly is not optional: the default is Debug, which is 6.5 MB of
          # wasm against 2.9 MB released, and nothing in the output tells you which you got.
          opt=ReleaseFast
          [ "${{ matrix.target }}" = "wasm32-freestanding" ] && opt=ReleaseSmall
          cd packages/wasm
          zig build -Dtarget=${{ matrix.target }} -Doptimize=$opt \
                    -Dcapi='${{ needs.version.outputs.capi }}' \
                    --prefix "$GITHUB_WORKSPACE/dist/${{ matrix.target }}"
      - name: Archive
        run: |
          set -euo pipefail
          v='${{ needs.version.outputs.version }}'
          mkdir -p out
          ( cd "dist/${{ matrix.target }}" && tar czf "$GITHUB_WORKSPACE/out/libd2-$v-${{ matrix.target }}.tar.gz" . )
          ls -l out/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: out/
          if-no-files-found: error   # a target that produced nothing is a failed release

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: dist-*, merge-multiple: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          v='${{ needs.version.outputs.version }}'
          tag='${{ needs.version.outputs.tag }}'
          echo "archives:"; ls -1 artifacts/

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: would create release $tag with the above"; exit 0
          fi

          # The tag already exists when this runs from a tag push; create it only when a
          # human dispatched a real (non-dry) run off a branch.
          git rev-parse "$tag" >/dev/null 2>&1 || { git tag "$tag" && git push origin "$tag"; }

          gh release create "$tag" artifacts/libd2-$v-*.tar.gz \
            --title "libd2 $tag" \
            --notes "libd2 $tag — the whole library, one version. Native static lib + headers per target, plus wasm. Zig consumers: \`git+https://github.com/jaenster/libd2#$tag\`."

          # npm: packages/npm/libd2 is the published package — one `libd2` carrying the combined
          # wasm, not one package per subsystem. It ships its own TypeScript, so there is nothing
          # to compile here; the wasm is the only thing CI has to put in place, at the name
          # src/wasm.ts loads it by. Published via OIDC trusted publishing (build provenance, no
          # NPM_TOKEN), which needs this repo/workflow registered as a trusted publisher on
          # npmjs.com and the first version published by hand — OIDC cannot bootstrap a name.
          wasm="$(find artifacts -name 'libd2-*-wasm32-freestanding.tar.gz' | head -1)"
          if [ -z "$wasm" ]; then
            echo "::error::no wasm artifact — refusing to publish an npm package without it"; exit 1
          fi
          mkdir -p /tmp/w && tar xzf "$wasm" -C /tmp/w
          cp "$(find /tmp/w -name '*.wasm' | head -1)" packages/npm/libd2/src/libd2.wasm
          cd packages/npm/libd2
          # The tag is the one version. --no-git-tag-version because the repo tag already exists.
          npm version "$v" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public
