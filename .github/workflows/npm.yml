name: npm

# The libd2 umbrella package is versioned and released on its own, separately from the
# per-subsystem @jaenster/d2<name> packages that release.yml ships. It carries no wasm of its
# own: it depends on those packages and re-exports them under namespaces, so a release here is
# either a new namespace or a bumped dependency range.
#
# Publishing uses npm trusted publishing (OIDC), so there is no NPM_TOKEN secret. The trusted
# publisher on npmjs.com must name THIS file (npm.yml) as its workflow, and the package has to
# exist already: OIDC cannot claim a name, so 0.1.0 was published by hand.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 0.2.0'
        required: true
        type: string
      drlg_range:
        description: 'Optional new @jaenster/d2drlg range, e.g. ^0.5.0. Blank keeps the current one.'
        required: false
        type: string
      dry_run:
        description: 'Build, smoke-test and pack only — no publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # OIDC token issuance for trusted publishing

defaults:
  run:
    working-directory: packages/npm/libd2

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1

      - name: Set the version and dependency range
        run: |
          v='${{ inputs.version }}'
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a semver: $v"; exit 1; }
          npm pkg set version="$v"
          range='${{ inputs.drlg_range }}'
          # Not `[ -n .. ] && ..`: Actions runs this with bash -e, so the blank case would
          # exit non-zero and fail the step.
          if [ -n "$range" ]; then npm pkg set dependencies.@jaenster/d2drlg="$range"; fi
          npm pkg get version dependencies

      # The umbrella is nothing but re-exports, so the only thing that can break it is a
      # dependency that no longer has what it re-exports. Packing and installing the tarball
      # for real is what catches that, and it costs seconds.
      - name: Smoke-test the packed tarball
        run: |
          set -euo pipefail
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install --silent "$RUNNER_TEMP/$tarball"
          cat > smoke.mjs <<'JS'
          import { drlg } from 'libd2';
          const map = await drlg.render(1337, 0, 0);
          const cold = map.levels.find(l => l.levelNo === 3);
          if (map.levels.length !== 39) throw new Error(`expected 39 levels, got ${map.levels.length}`);
          if (cold.displayName !== 'Cold Plains') throw new Error(`expected Cold Plains, got ${cold.displayName}`);
          if (cold.rooms.length !== 97) throw new Error(`expected 97 rooms, got ${cold.rooms.length}`);
          console.log(`ok: ${map.levels.length} levels, ${cold.displayName} with ${cold.rooms.length} rooms`);
          JS
          node smoke.mjs

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
