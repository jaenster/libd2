name: npm

# The `libd2` npm package: one package for the whole library, matching `libd2` on crates.io
# and `LibD2` on NuGet. Each subsystem is a namespace carrying its own wasm, and also a
# subpath export so a bundler can take one instead of all.
#
# It carries the library's version like everything else, so pushing a vX.Y.Z tag publishes it —
# a release that needs somebody to remember a second command is not a release. This is the ONLY
# thing a tag does now. There used to be a release workflow cross-compiling sixteen targets into
# a GitHub Release next to it; nothing downloaded them. nuget builds its own natives and reads
# its own workflow artifacts, the Go module is served from the git tag itself with its natives
# committed, and crates has nothing per-target at all. Sixteen runner jobs a tag, for files no
# consumer ever asked for.
#
# Publishing uses npm trusted publishing (OIDC), so there is no NPM_TOKEN secret anywhere. The
# trusted publisher on npmjs.com names THIS FILE, which is the whole reason npm publishing lives
# here and not in release.yml: an OIDC token is bound to a repository AND a workflow file, so the
# same publish attempted from another file is refused — with a 404, because npm will not reveal
# whether a package exists. The package must also already exist; OIDC cannot claim a name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 0.2.0 (defaults to the tag when run from one)'
        required: false
        type: string
      dry_run:
        description: 'Build, pack and smoke-test only — no publish'
        type: boolean
        default: true
      tag:
        description: 'npm dist-tag to publish under (latest, next, ...)'
        default: 'latest'
        type: string

permissions:
  contents: read
  id-token: write   # OIDC token issuance for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1

      - name: Resolve and check the version
        run: |
          set -euo pipefail
          # The tag is the source of truth when there is one, so a release cannot publish a
          # version other than the one it is named for.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            # Off a branch, an unspecified version means the one the library currently claims,
            # so a dry run needs no arguments.
            v='${{ inputs.version }}'
            [ -n "$v" ] || v="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a semver: $v"; exit 1; }
          # And it must be the version the library itself claims, or the npm package and the
          # zig package with the same name describe different code.
          manifest="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -1)"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$manifest" != "$v" ]; then
            echo "::error::tag v$v does not match build.zig.zon version $manifest"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "publishing libd2 $v"

      # Fresh wasm rather than the copy checked in beside the shim. One module carrying several
      # subsystems, because the shim passes pointers between them and separate modules would have
      # separate memories — see packages/wasm/src/root.zig.
      #
      # -Dcapi names exactly what the TypeScript calls, which is not the same as "all". `item`
      # is 888 KB of excel tables and the shim does not reference a single d2item_ export, so
      # the default set would put a 45% larger wasm in front of every browser consumer to ship
      # nothing they can use. `net` is 9 KB, and the live layer calls it. When the shim starts
      # calling a subsystem, add it here — and when it stops, take it out.
      - name: Build the WebAssembly
        run: |
          set -euo pipefail
          ( cd packages/wasm && zig build -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall \
              -Dcapi=drlg,pf,net --prefix "$GITHUB_WORKSPACE/dist" )
          ls -la dist/bin/libd2.wasm

      - name: Assemble and pack
        run: DRY_RUN=1 ./scripts/npm-libd2-pack.sh "$VERSION" dist/bin/libd2.wasm

      # Smoke-tests the exact tarball that gets published, so what ships is what was tested. The
      # package's own suite already ran against the source during the pack; what only the tarball
      # can prove is that the emitted JS resolves its own imports and finds the wasm beside it.
      - name: Smoke-test the packed tarball
        run: |
          set -euo pipefail
          tarball="$PWD/libd2-$VERSION.tgz"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install --silent "$tarball"
          cat > smoke.mjs <<'JS'
          import { init, open, Areas, route } from 'libd2';
          await init();
          using game = open({ seed: 1337 });
          const town = game.area(Areas.RogueEncampment);
          const cold = game.area(Areas.ColdPlains);
          if (cold.name !== 'Cold Plains') throw new Error(`expected Cold Plains, got ${cold.name}`);
          if (cold.rooms.length !== 97) throw new Error(`expected 97 rooms, got ${cold.rooms.length}`);
          if (game.generatedActs.length !== 1) throw new Error('one act should cover both areas');
          const trip = route(town.middle, cold.middle, { teleport: true });
          if (!trip) throw new Error('no route across the seam');
          // Deliberately also route to a ROOM, because that crosses the frames: a Location is
          // level-local subtiles and a Room is world TILES, and mixing them is silent — route
          // just returns null. fromWorld is the conversion, and this is the assertion that the
          // two halves of the published surface still fit together.
          const room = cold.fromWorld(cold.rooms[0].x * 5, cold.rooms[0].y * 5);
          if (!route(town.middle, room, { teleport: true })) throw new Error('no route to room 0');
          console.log(`ok: ${cold.name} ${cold.rooms.length} rooms, ${trip.legs.length} legs across the seam`);
          JS
          node smoke.mjs

      - name: Publish
        # A tag PUSH publishes; a hand-run publishes only when asked, which is why dry_run
        # defaults to true. The test is the EVENT, not the ref type: dispatching this against a
        # tag — `gh workflow run npm.yml --ref v0.5.1` — also reports ref_type=tag, so keying on
        # that made a hand-run against a tag publish while claiming to be a dry run.
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish "libd2-$VERSION.tgz" --access public --provenance --tag "${{ inputs.tag || 'latest' }}"
