name: crates

# The Rust crate is versioned and released on its own, separately from the zig packages.
#
# Unlike npm and NuGet it ships no prebuilt binaries. A crate is source, and cargo already
# knows the target it is building for, so the build script compiles the engine for exactly
# that one. There is no release matrix here because there is nothing per-target to release.
#
# Publishing uses crates.io trusted publishing (OIDC), so there is no stored API token. The
# policy on crates.io must name THIS file (crates.yml) as its Workflow filename. crates.io
# scopes that policy PER CRATE and requires the crate to exist first, so the first version has
# to be published once with a personal token before this workflow can take over.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Crate version, e.g. 0.1.0 or 0.1.0-rc.1'
        required: true
        type: string
      dry_run:
        description: 'Build, test and package only — no publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # OIDC token issuance for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }

      - name: Set the crate version
        working-directory: packages/rust/libd2
        run: |
          v='${{ inputs.version }}'
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "not a semver: $v"; exit 1; }
          sed -i -E "0,/^version = \".*\"$/s//version = \"$v\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Test
        working-directory: packages/rust/libd2
        run: cargo test --all-features

      # Cross-compiling needs nothing but the target's std, because zig cross-compiles the
      # engine from any host. One target is enough to keep that honest.
      - name: Cross-compile
        working-directory: packages/rust/libd2
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl

      # Vendors the engine into the crate and builds it from there. Catches what `cargo test`
      # cannot: whether the packaged crate is self-contained, since the engine sources live
      # outside the crate root and cargo will not package anything above it.
      - name: Package
        run: ./scripts/crates-pack.sh

      # Runs on dry runs too. The exchange is what proves the trusted-publishing policy matches
      # (repo, workflow file name, owner), and finding a mismatch here costs nothing, whereas
      # finding it during a real release burns a version number.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: packages/rust/libd2
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --all-features --allow-dirty
