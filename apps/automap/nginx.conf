server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # libd2.wasm is ~1.9 MB and almost all of it is @embedFile'd TSV game tables, which compress
    # several-fold. Serving it uncompressed costs more than any amount of code-size work saves.
    gzip_types
        application/wasm
        application/javascript
        application/json
        text/css
        text/plain
        image/svg+xml;

    # Content-addressed bundle assets never change under their hashed name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The wasm is NOT content-addressed, so it must revalidate rather than be pinned for a year.
    location = /libd2.wasm {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
